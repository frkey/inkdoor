{% extends "base.html" %}
{% block title %}{{ t("admin.login_title") }} · {{ t("admin.title") }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t("admin.login_title") }}</h1>
  {% if no_password %}
  <p class="alert" role="alert">{{ t("admin.no_password") }}</p>
  {% endif %}
  {% if error %}
  <p class="alert" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">{{ t("admin.password_label") }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autocapitalize="off" spellcheck="false" required autofocus>
    <button type="submit">{{ t("admin.login_button") }}</button>
  </form>
</section>
{% endblock %}
