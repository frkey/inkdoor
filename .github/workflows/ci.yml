name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays: the audit also catches advisories published since the last push

# Read-only token: no job writes to the repository
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Render previews (both languages)
        run: |
          inkdoor -o output --lang en-US demo 10:20 15:20 16:50 21:10
          inkdoor -o output --lang pt-BR demo 10:20 15:20 16:50 21:10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.python == '3.12'
        with:
          name: previews
          path: output/*.png

  kindle-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: ShellCheck
        working-directory: kindle
        run: shellcheck inkdoor/*.sh documents/*.sh kpm/*.sh
      - name: ShellCheck (deploy)
        run: shellcheck deploy/*.sh deploy/proxmox/*.sh

  # Known vulnerabilities in the pinned versions that deploy/install.sh installs
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --require-hashes -r deploy/requirements.txt
