[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkdoor"
version = "1.0.0"
description = "An e-ink calendar display for your door, made from an old Kindle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "icalendar>=5",
    "recurring-ical-events>=2.2",
    "requests>=2.28",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1.0",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
inkdoor = "inkdoor.__main__:main"

[project.urls]
Homepage = "https://github.com/frkey/inkdoor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkdoor = [
    "fonts/*.otf", "fonts/OFL.txt", "locales/*.json",
    "web/templates/*.html", "web/static/*.css", "web/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
